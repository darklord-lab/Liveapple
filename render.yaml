services:
  - type: web
    name: classora-api
    runtime: node
    rootDir: apps/api
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run db:reset-demo
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: FORCE_DEMO_RESET
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "30"
      - key: INVITE_TOKEN_EXPIRES_HOURS
        value: "48"
      - key: CORS_ORIGINS
        value: "*"
      # Set in the Render dashboard: URL must start with wss://, from a LiveKit Cloud project. Never commit real values.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
