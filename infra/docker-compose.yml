version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: classora-livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50020:50000-50020/udp"
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: classora-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=file:./dev.db
      - JWT_ACCESS_SECRET=classora_super_secret_access_jwt_key_2026_change_in_prod
      - JWT_REFRESH_SECRET=classora_super_secret_refresh_jwt_key_2026_change_in_prod
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    depends_on:
      - livekit
    restart: unless-stopped
